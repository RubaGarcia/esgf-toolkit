[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esgf-stac-toolkit"
version = "0.2.0"
description = "Search, download, catalogue and plot ESGF holdings via the STAC API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["requests", "pandas", "matplotlib"]

[tool.hatch.build.targets.wheel]
packages = ["src/esgf_stac"]
